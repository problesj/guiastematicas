security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        personal:
            entity:
                class: App\Entity\Usuario
                property: email

    # Administrador > Editor > Colaborador (ver App\Enum\Rol).
    role_hierarchy:
        ROLE_ADMINISTRADOR: ROLE_EDITOR
        ROLE_EDITOR: ROLE_COLABORADOR

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: personal
            user_checker: App\Security\VerificadorUsuario
            entry_point: App\Security\AccesoFormularioAuthenticator
            custom_authenticators:
                - App\Security\AccesoFormularioAuthenticator
                - App\Security\GoogleAuthenticator
            # Máximo 5 intentos fallidos por minuto para un mismo usuario e IP.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: salir
                enable_csrf: true
                target: raiz

    # Solo se aplica la primera regla que coincide.
    access_control:
        - { path: ^/(es|en)/admin, roles: ROLE_ADMINISTRADOR }
        - { path: ^/(es|en)/panel, roles: ROLE_COLABORADOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
