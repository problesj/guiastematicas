# Entorno de desarrollo local. Uso: docker compose up -d --build
# Sitio en http://localhost:8080
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/guias
    environment:
      DATABASE_URL: "mysql://guias:guias@db:3306/guias?serverVersion=8.4.11&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: guias
      MYSQL_USER: guias
      MYSQL_PASSWORD: guias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - datos_mysql:/var/lib/mysql

volumes:
  datos_mysql:
