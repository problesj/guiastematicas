# VirtualHost para Ubuntu 26.04 LTS (Apache 2.4 + PHP-FPM 8.5).
# Copiar a /etc/apache2/sites-available/guias.conf y activar con: a2ensite guias
# certbot --apache añade después el bloque HTTPS en el servidor de producción.
<VirtualHost *:80>
    ServerName guias.example.ucn.cl
    DocumentRoot /var/www/guias/public

    <Directory /var/www/guias/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Las fotos subidas nunca se ejecutan como PHP.
    <Directory /var/www/guias/public/uploads>
        <FilesMatch "\.(php|phar|phtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # No servir archivos ocultos ni de configuración.
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Los bloques incrustables (/es|en/incrustar/...) se muestran en otras webs: la aplicación envía
    # "Content-Security-Policy: frame-ancestors *", que en los navegadores actuales prevalece sobre esta cabecera.
    Header always set X-Frame-Options "SAMEORIGIN" "expr=%{REQUEST_URI} !~ m#^/(es|en)/incrustar/#"

    ErrorLog ${APACHE_LOG_DIR}/guias-error.log
    CustomLog ${APACHE_LOG_DIR}/guias-access.log combined
</VirtualHost>
