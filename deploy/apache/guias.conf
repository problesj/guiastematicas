# VirtualHost para Ubuntu 26.04 LTS (Apache 2.4 + PHP-FPM 8.5).
# Copiar a /etc/apache2/sites-available/guias.conf y activar con: a2ensite guias
# certbot --apache añade después el bloque HTTPS en el servidor de producción.
<VirtualHost *:80>
    ServerName guias.example.ucn.cl
    DocumentRoot /var/www/guias/public

    <Directory /var/www/guias/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Las fotos subidas nunca se ejecutan como PHP.
    <Directory /var/www/guias/public/uploads>
        <FilesMatch "\.(php|phar|phtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # No servir archivos ocultos ni de configuración.
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    # «set» (no «always») reemplaza la misma cabecera que ya envía la aplicación, en vez de duplicarla.
    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Solo tiene efecto por HTTPS (los navegadores la ignoran por HTTP): una vez con certificado, el sitio se pide
    # siempre cifrado durante un año. Sin includeSubDomains, para no afectar otros sitios de ucn.cl.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
    # Los bloques incrustables (/es|en/incrustar/...) se muestran en otras webs: la aplicación envía
    # "Content-Security-Policy: frame-ancestors *", que en los navegadores actuales prevalece sobre esta cabecera.
    Header set X-Frame-Options "SAMEORIGIN" "expr=%{REQUEST_URI} !~ m#^/(es|en)/incrustar/#"

    ErrorLog ${APACHE_LOG_DIR}/guias-error.log
    CustomLog ${APACHE_LOG_DIR}/guias-access.log combined
</VirtualHost>
