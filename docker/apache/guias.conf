<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/guias/public

    <Directory /var/www/guias/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
